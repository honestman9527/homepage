# About 是单条数据集合；zh 和 en 两种语言都必须存在。
about:
  zh:
    title: 关于
    description: 简单介绍
    # 章节按数组顺序显示。id 使用小写字母、数字和连字符，且在当前语言内唯一。
    sections:
      - id: introduction
        title: 自我介绍
        # 每个章节至少一个段落；内容按纯文本输出，不解析 Markdown、MDX 或 HTML。
        paragraphs:
          - 这里写介绍——一两句话说明你是谁、在意什么、喜欢解决什么样的问题。
      - id: current-focus
        title: 最近关注
        paragraphs:
          - 第二段可以写你现在的关注点、坐标，或正在学的东西。
  en:
    title: About
    description: A short introduction
    # 两种语言的章节无需一一对应，但建议使用相同 id 方便维护。
    sections:
      - id: introduction
        title: Introduction
        paragraphs:
          - Introduce yourself here — who you are, what you care about, and the kind of problems you enjoy solving.
      - id: current-focus
        title: Current focus
        paragraphs:
          - A second paragraph works well for your current focus, location, or what you’re learning right now.
