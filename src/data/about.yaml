# About 是单条中文数据集合。
about:
  title: 关于
  description: 简单介绍
  # 章节按数组顺序显示。id 使用小写字母、数字和连字符，且在所有章节内唯一。
  sections:
    - id: introduction
      title: 自我介绍
      # 每个章节至少一个段落；内容按纯文本输出，不解析 Markdown、MDX 或 HTML。
      paragraphs:
        - 这里写介绍——一两句话说明你是谁、在意什么、喜欢解决什么样的问题。
    - id: current-focus
      title: 最近关注
      paragraphs:
        - 第二段可以写你现在的关注点、坐标，或正在学的东西。
