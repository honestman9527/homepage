# 项目按 year 降序排列，同年按 id 排序。
# originalLang 必须为 zh 或 en，且 translations 中必须存在对应语言。
# 当前页面语言缺译时会回退到原文，并显示原文语言标记。
- id: CF-Workers-Navigation
  originalLang: zh
  translations:
    zh:
      title: Navigation
      description: >-
        部署在 Cloudflare Workers 上的个人书签柜：标签组织书签，启动台首页支持搜索与常用网站，Web 支持公开浏览，私有内容和管理操作需要登录。
    en:
      title: Navigation
      description: >-
        Deployed on Cloudflare Workers, this is a personal bookmark cabinet: bookmarks are organized by tags, the launchpad homepage supports search and frequently used websites, web access supports public browsing, while private content and management operations require login.

  # tags 可省略，默认为空数组。
  tags: [Cloudflare Worker, Hono, React, Tailwind CSS]
  # href 必填；demoHref 可省略。两者都必须为 HTTP(S) 地址。
  href: https://github.com/honestman9527/CF-Workers-Navigation
  demoHref: https://nav.7s.nz
  # year 接受 1900–9999 的整数；featured 可省略，默认为 false。
  year: 2026
  featured: true
  # 可选封面示例：
  cover:
    type: image # 也可使用 image 或 none
    src: https://raw.7s.nz/file/blog/ydHYc3Bj.webp
    alt: 首页
- id: CF-Workers-ShortLinks
  originalLang: zh
  translations:
    zh:
      title: ShortLinks
      description: >-
        一个公开使用的临时短链服务。用户无需注册，只能选择 1、3 或 7 天；到期立即停止跳转，D1 记录由每 15 分钟运行的 Cron 清理。后台使用 Cloudflare Access，不提供普通用户账号、访问次数统计或自定义短码。
    en:
      title: ShortLinks
      description: >-
        A temporary short link service for public use. Users do not need to register and can only choose 1, 3, or 7 days; the link will stop redirecting immediately after expiration, and D1 records are cleaned up by a Cron job that runs every 15 minutes. The backend uses Cloudflare Access, and no regular user accounts, access statistics, or custom short codes are provided.
  # tags 可省略，默认为空数组。
  tags: [Cloudflare Worker, Hono, React, Tailwind CSS]
  # href 必填；demoHref 可省略。两者都必须为 HTTP(S) 地址。
  href: https://github.com/honestman9527/CF-Workers-ShortLinks
  demoHref: https://s.7s.nz
  # year 接受 1900–9999 的整数；featured 可省略，默认为 false。
  year: 2026
  featured: true
  # 可选封面示例：
  cover:
    type: image # 也可使用 image 或 none
    src: https://raw.7s.nz/file/blog/LFqX0kNV.webp
    alt: 首页
