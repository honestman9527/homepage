# yaml-language-server: $schema=none
# 音乐配置在构建期校验；对象不接受未声明的字段。
# 填入自己的音频后再启用；src/cover 支持 public/ 根相对路径或 HTTPS。
# 建议精选 3–10 首；每首包含 title、artist、src，可选 cover；src 不可重复。
music:
  enabled: true
  # 电脑端默认位于内容区域右下；访客可切换位置并收起，偏好保存在本机。
  desktop:
    position: bottom-right
    defaultCollapsed: false
  tracks:
    - title: 枫
      artist: 周杰伦
      src: https://1827770114.cdn.123clouddisk.com/1827770114/122129499#
