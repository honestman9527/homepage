name: HonestOS manual check and deploy
run-name: HonestOS ${{ inputs.mode }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the selected commit, or check and deploy the default branch
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy

permissions:
  contents: read

# Check runs are independent. Production runs queue without interrupting a release.
concurrency:
  group: honestos-${{ inputs.mode == 'deploy' && 'production' || github.run_id }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject production deployment from a non-default branch
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REQUESTED_MODE" == "deploy" && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Production deployment requires the repository default branch."
            exit 1
          fi

      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install locked pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false

      - name: Install project Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, core behavior tests, production build and Cloudflare preview
        run: pnpm verify -- check

      - name: Preserve verification logs, including failed checks
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Record the checked bundle and revision
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          printf '%s\n' "$GITHUB_SHA" > revision.txt

      - name: Preserve the checked bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honestos-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            dist.sha256
            revision.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Deploy the checked static bundle
        if: ${{ inputs.mode == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          sha256sum --check dist.sha256
          pnpm exec wrangler deploy --message "GitHub commit ${GITHUB_SHA}"
